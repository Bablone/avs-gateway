name: AVS Gateway CI

on:
  push:
    branches: [main, ALEEZ]
  pull_request:
    branches: [main, ALEEZ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev dependencies
        run: |
          pip install pytest pytest-asyncio

      - name: Install package
        run: |
          pip install -e .

      - name: Run test suite
        run: |
          python -m pytest avs_gateway/tests -q

      - name: Verify CLI commands
        run: |
          avs version
          avs quickstart

      - name: Run quickstart examples
        run: |
          python examples/quickstart/01_gateway_basics.py
          python examples/quickstart/02_governed_tool.py
          python examples/quickstart/04_custom_action.py

      - name: Verify README contains required phrases
        run: |
          grep -q "Runtime Permission Layer for AI Agents" README.md
          grep -q "Every agent action gets a receipt" README.md

      - name: Verify LICENSE exists and is Apache 2.0
        run: |
          test -f LICENSE
          grep -q "Apache License" LICENSE
